<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Group Bot</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Instagram Group Message Bot</h1>

        <div class="card">
            <h2>🔐 Login</h2>
            <input id="username" placeholder="Instagram Username">
            <input id="password" placeholder="Instagram Password" type="password">
        </div>

        <div class="card">
            <h2>💬 Message Settings</h2>
            <textarea id="message" placeholder="Write your message..."></textarea>
            <input id="custom_name" placeholder="Custom Sender Name (optional)">
        </div>

        <div class="card">
            <h2>👥 Group IDs</h2>
            <textarea id="group_ids" placeholder="Enter group IDs separated by commas..."></textarea>
        </div>

        <div class="card">
            <h2>⏱ Delay Settings</h2>
            <input id="delay" placeholder="Delay between messages (seconds)" type="number">
            <input id="cyclone_delay" placeholder="Cyclone delay (seconds)" type="number">
        </div>

        <div class="buttons">
            <button onclick="startBot()" class="start">Start Bot</button>
            <button onclick="stopBot()" class="stop">Stop Bot</button>
        </div>

        <div class="card logs">
            <h2>📡 Live Logs</h2>
            <pre id="logs"></pre>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
