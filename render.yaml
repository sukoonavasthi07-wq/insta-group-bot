services:
  - type: web
    name: insta-telegram-bot
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python app.py"
    envVars:
      - key: INSTAGRAM_USERNAME
        sync: false
      - key: INSTAGRAM_PASSWORD
        sync: false
      - key: INSTAGRAM_GROUP_ID
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
